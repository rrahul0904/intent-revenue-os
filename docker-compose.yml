services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: intent_revenue_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  web:
    build: .
    depends_on: [postgres]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/intent_revenue_os
      APP_BASE_URL: http://localhost:3000
    ports: ["3000:3000"]
volumes:
  postgres_data:
