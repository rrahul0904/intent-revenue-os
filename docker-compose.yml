services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: intent_revenue_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intent_revenue_os"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: builder
    command: npm run db:migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/intent_revenue_os
    restart: "no"

  web:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/intent_revenue_os
      AUTH_MODE: demo
      DEMO_USER_ID: demo-founder
      DEMO_USER_NAME: Demo Founder
      ALLOW_DEMO_AUTH_IN_PRODUCTION: "true"
      APP_BASE_URL: http://localhost:3000
      WEBSITE_FETCH_ENABLED: ${WEBSITE_FETCH_ENABLED:-true}
    ports: ["3000:3000"]

  worker:
    build:
      context: .
      target: builder
    command: npm run worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/intent_revenue_os
      WEBSITE_FETCH_ENABLED: ${WEBSITE_FETCH_ENABLED:-true}
      WEBSITE_FETCH_TIMEOUT_MS: ${WEBSITE_FETCH_TIMEOUT_MS:-12000}
      WEBSITE_FETCH_MAX_BYTES: ${WEBSITE_FETCH_MAX_BYTES:-1200000}
      WEBSITE_FETCH_USER_AGENT: ${WEBSITE_FETCH_USER_AGENT:-SignalOS/0.3}
      REDDIT_API_ENABLED: ${REDDIT_API_ENABLED:-false}
      REDDIT_COMMERCIAL_ACCESS_APPROVED: ${REDDIT_COMMERCIAL_ACCESS_APPROVED:-false}
      REDDIT_ACCESS_TOKEN: ${REDDIT_ACCESS_TOKEN:-}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-SignalOS/0.3}
      REDDIT_SEARCH_LIMIT: ${REDDIT_SEARCH_LIMIT:-50}
      WORKER_ID: ${WORKER_ID:-}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-2000}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      WORKER_MAX_JOBS_PER_LOOP: ${WORKER_MAX_JOBS_PER_LOOP:-25}

volumes:
  postgres_data:
